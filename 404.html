<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — Alott</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#050509">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Instrument+Serif:ital@1&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#050509;--border:rgba(255,255,255,0.08);--text:#eef0f6;--muted:#9a9fb4;--cyan:#22d3ee;--emerald:#34d399}
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;
    min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;
    -webkit-font-smoothing:antialiased;
    background-image:radial-gradient(ellipse 60% 50% at 50% 0%, rgba(34,211,238,0.06), transparent 60%);
  }
  .code{
    font-family:'JetBrains Mono',monospace;font-size:.75rem;letter-spacing:.3em;
    color:var(--cyan);font-weight:500;margin-bottom:16px;text-transform:uppercase;
  }
  h1{font-size:clamp(2rem,6vw,3.2rem);font-weight:800;letter-spacing:-.03em;line-height:1.1;margin-bottom:14px}
  h1 em{
    font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-weight:400;
    background:linear-gradient(120deg,var(--cyan),var(--emerald));
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  }
  p{color:var(--muted);max-width:420px;margin:0 auto 32px;line-height:1.7;font-weight:300}
  .btn{
    display:inline-block;padding:13px 26px;border-radius:10px;font-weight:600;font-size:.88rem;
    text-decoration:none;background:linear-gradient(120deg,var(--cyan),var(--emerald));color:#04060a;
    box-shadow:0 4px 28px rgba(34,211,238,0.22);transition:transform .2s,box-shadow .2s;
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 8px 40px rgba(34,211,238,0.35)}
</style>
</head>
<body>
  <div>
    <div class="code">Error · 404</div>
    <h1>This page fell off <em>the manifold.</em></h1>
    <p>The page you're looking for doesn't exist or has moved. The geometry will recover — let's get you back to solid ground.</p>
    <a class="btn" href="/">← Back home</a>
  </div>
</body>
</html>
